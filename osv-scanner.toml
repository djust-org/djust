# Known advisories in vendored browser packages that we accept for now.
# Every entry needs a reason and an ignoreUntil date; after that date the
# advisory fails CI again. Add entries only with a linked issue.
#
# [[IgnoredVulns]]
# id = "GHSA-xxxx-xxxx-xxxx"
# ignoreUntil = 2026-12-31
# reason = "Not reachable: … (#NNNN)"

[[IgnoredVulns]]
id = "RUSTSEC-2026-0543"
ignoreUntil = 2027-03-31
reason = "chrono is flagged unmaintained (informational, no CVSS, no affected functions, no fixed version), not vulnerable. 2.0 replaces it with jiff (#4222); the 1.3 line takes security fixes only, so it keeps chrono and accepts the notice (#4219)."


# Known advisories in vendored browser packages that we accept for now.
# Every entry needs a reason and an ignoreUntil date; after that date the
# advisory fails CI again. Add entries only with a linked issue.
#
# [[IgnoredVulns]]
# id = "GHSA-xxxx-xxxx-xxxx"
# ignoreUntil = 2026-12-31
# reason = "Not reachable: … (#NNNN)"

# Reviewed 2026-11-18. Informational "unmaintained" notices for every version,
# with no CVSS, no affected functions and no fixed version: not a known
# vulnerability in djust's use (template date filters and timezone conversion).
# Replacement tracked in #4222.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0543"
ignoreUntil = 2027-02-28
reason = "chrono 0.4.45 is marked unmaintained (informational, no vulnerability); replacement tracked in #4222"


{% if tag == "a" %}
<a class="{{ css_prefix }}btn {{ css_prefix }}btn-{{ variant|force_escape }} {{ css_prefix }}btn-{{ size|force_escape }} {% if attrs.class %}{{ attrs.class|force_escape }}{% endif %}"
        {% if attrs.id %}id="{{ attrs.id|force_escape }}"{% endif %}
        {% if attrs.onclick %}onclick="{{ attrs.onclick|force_escape }}"{% endif %}
        {% if href %}href="{{ href }}"{% endif %}
        {{ extra_attrs }}>
{% else %}
<button class="{{ css_prefix }}btn {{ css_prefix }}btn-{{ variant|force_escape }} {{ css_prefix }}btn-{{ size|force_escape }} {% if attrs.class %}{{ attrs.class|force_escape }}{% endif %}"
        {% if attrs.id %}id="{{ attrs.id|force_escape }}"{% endif %}
        {% if attrs.onclick %}onclick="{{ attrs.onclick|force_escape }}"{% endif %}
        {% if attrs.type %}type="{{ attrs.type|force_escape }}"{% endif %}
        {{ extra_attrs }}>
{% endif %}
    <span class="{{ css_prefix }}btn-ripple"></span>
    {% if slot_loading %}{{ slot_loading }}{% else %}{% if slot_icon %}{{ slot_icon }} {% endif %}{% if slot_content %}{{ slot_content }}{% else %}{{ text }}{% endif %}{% endif %}
{% if tag == "a" %}</a>{% else %}</button>{% endif %}

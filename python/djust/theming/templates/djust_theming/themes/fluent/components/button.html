<button class="{{ css_prefix }}btn {{ css_prefix }}btn-{{ variant }} {{ css_prefix }}btn-{{ size }} {% if attrs.class %}{{ attrs.class }}{% endif %}"
        {% if attrs.id %}id="{{ attrs.id }}"{% endif %}
        {% if attrs.onclick %}onclick="{{ attrs.onclick }}"{% endif %}
        {% if attrs.type %}type="{{ attrs.type }}"{% endif %}>
    <span class="{{ css_prefix }}btn-reveal"></span>
    {% if slot_loading %}{{ slot_loading }}{% else %}{% if slot_icon %}{{ slot_icon }} {% endif %}{% if slot_content %}{{ slot_content }}{% else %}{{ text }}{% endif %}{% endif %}
</button>

<span class="{{ css_prefix }}tooltip {% if attrs.class %}{{ attrs.class|force_escape }}{% endif %}"
      data-tooltip="{{ text|force_escape }}"
      data-tooltip-position="{{ position|force_escape }}"
      aria-describedby="{{ tooltip_id|force_escape }}"
      {% if attrs.id %}id="{{ attrs.id|force_escape }}"{% endif %}>{% if slot_content %}{{ slot_content }}{% else %}{{ text }}{% endif %}<span id="{{ tooltip_id|force_escape }}" role="tooltip" hidden>{{ text }}</span></span>

<div class="{{ css_prefix }}checkbox-group {% if attrs.class %}{{ attrs.class|force_escape }}{% endif %}">
    <input
        type="checkbox"
        name="{{ name|force_escape }}"
        id="{{ name|force_escape }}"
        class="{{ css_prefix }}checkbox"
        {% if attrs.checked %}checked{% endif %}
        {% if attrs.required %}required{% endif %}
        {% if attrs.disabled %}disabled{% endif %}
        {% if attrs.value %}value="{{ attrs.value|force_escape }}"{% endif %}
    />
    {% if slot_label %}
    {{ slot_label }}
    {% elif label %}
    <label for="{{ name|force_escape }}" class="{{ css_prefix }}checkbox-label">{{ label }}</label>
    {% endif %}
    {% if slot_description %}
    <div class="{{ css_prefix }}checkbox-description">{{ slot_description }}</div>
    {% elif description %}
    <div class="{{ css_prefix }}checkbox-description">{{ description }}</div>
    {% endif %}
</div>

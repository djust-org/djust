<div class="{{ css_prefix }}progress-wrapper {% if attrs.class %}{{ attrs.class|force_escape }}{% endif %}"
     {% if attrs.id %}id="{{ attrs.id|force_escape }}"{% endif %}
     {{ extra_attrs }}>
    {% if slot_label %}
    {{ slot_label }}
    {% elif label %}
    <div class="{{ css_prefix }}progress-label">{{ label }}</div>
    {% endif %}
    <div class="{{ css_prefix }}progress {% if is_indeterminate %}{{ css_prefix }}progress-indeterminate{% endif %}"
         role="progressbar"
         aria-valuemin="0"
         aria-valuemax="{{ max|force_escape }}"
         {% if not is_indeterminate %}aria-valuenow="{{ value|force_escape }}"{% endif %}
         {% if label %}aria-label="{{ label|force_escape }}"{% endif %}>
        {% if not is_indeterminate %}
        <div class="{{ css_prefix }}progress-bar {{ css_prefix }}progress-w-{{ width_percent|force_escape }}"></div>
        {% endif %}
    </div>
</div>

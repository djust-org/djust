<div class="{{ css_prefix }}textarea-group {% if attrs.class %}{{ attrs.class|force_escape }}{% endif %}">
    {% if slot_label %}
    {{ slot_label }}
    {% elif label %}
    <label for="{{ field_id|default:name|force_escape }}" class="{{ css_prefix }}textarea-label">{{ label }}</label>
    {% endif %}
    {% if slot_textarea %}
    {{ slot_textarea }}
    {% else %}
    <textarea
        name="{{ name|force_escape }}"
        id="{{ field_id|default:name|force_escape }}"
        placeholder="{{ placeholder|force_escape }}"
        rows="{{ rows|force_escape }}"
        class="{{ css_prefix }}textarea"
        {% if attrs.required %}required{% endif %}
        {% if attrs.disabled %}disabled{% endif %}
        {% if attrs.readonly %}readonly{% endif %}
    >{% if attrs.value %}{{ attrs.value }}{% endif %}</textarea>
    {% endif %}
    {% if slot_help_text %}
    <div class="{{ css_prefix }}textarea-help">{{ slot_help_text }}</div>
    {% endif %}
    {% if slot_error %}
    <div class="{{ css_prefix }}textarea-error" role="alert">{{ slot_error }}</div>
    {% endif %}
</div>

<a href="{{ url }}"
   class="{{ css_prefix }}nav-link theme-nav-link{% if is_active %} active{% endif %} {% if attrs.class %}{{ attrs.class|force_escape }}{% endif %}"
   {% if is_active %}aria-current="page"{% endif %}
   {% if track_active %}data-dj-nav="{{ url|force_escape }}"{% endif %}
   {% if attrs.id %}id="{{ attrs.id|force_escape }}"{% endif %}
   {% if attrs.navigate and url %}dj-navigate="{{ url }}"{% endif %}>
    {% if slot_icon %}{{ slot_icon }}{% elif icon %}<span class="{{ css_prefix }}nav-link-icon">{{ icon }}</span>{% endif %}
    <span class="{{ css_prefix }}nav-link-label">{{ label }}</span>
    {% if slot_badge %}{{ slot_badge }}{% elif badge %}<span class="{{ css_prefix }}nav-link-badge">{{ badge }}</span>{% endif %}
</a>

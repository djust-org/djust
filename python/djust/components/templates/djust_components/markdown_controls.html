{# Include beside native FormMixin fields; field is the form field name. bubble_menu and floating_menu (#3108) follow menu_flag(): true/1/yes/on or false/0/no/off, any case; anything else keeps the default (bubble on, floating off). #}
<div class="dj-markdown-controls" dj-hook="MarkdownEditor" dj-update="ignore" data-field="{{ field|default:'body' }}" data-mode="{{ mode|default:'markdown' }}" data-bubble-menu="{% if bubble_menu|lower == 'false' or bubble_menu|lower == '0' or bubble_menu|lower == 'no' or bubble_menu|lower == 'off' %}false{% else %}true{% endif %}" data-floating-menu="{% if floating_menu|lower == 'true' or floating_menu|lower == '1' or floating_menu|lower == 'yes' or floating_menu|lower == 'on' %}true{% else %}false{% endif %}"></div>

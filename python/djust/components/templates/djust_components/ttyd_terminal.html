{% load static djust_assets %}
{% djust_asset "xterm" %}
<div id="dj-ttyd-terminal"
     class="dj-ttyd-terminal"
     dj-hook="TtydTerminal"
     data-ttyd-url="{{ ttyd_url }}"
     data-rows="{{ rows }}"
     data-cols="{{ cols }}"
     data-theme="{{ theme_json }}"
     data-xterm-src="{% djust_asset_url "xterm" %}"
     {% if strict_styles %}data-dj-style data-dj-style-width="100%" data-dj-style-height="100%" data-dj-style-min-height="calc({{ rows }} * 1.2em)" data-dj-style-background-color="#1e1e2e"{% else %}style="width: 100%; height: 100%; min-height: calc({{ rows }} * 1.2em); background: #1e1e2e;"{% endif %}>
</div>

{# The hook module registers itself: one hashed static URL, not an inline script a strict CSP #}
{# refuses, and the request's nonce for a 'strict-dynamic' policy (#4139). #}
<script type="module" src="{% static 'djust_components/ttyd/ttyd_terminal.js' %}"{% if csp_nonce %} nonce="{{ csp_nonce }}"{% endif %}></script>

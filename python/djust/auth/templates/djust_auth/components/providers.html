{% load djust_auth %}{% if providers %}<div class="dj-auth-providers">{% for p in providers %}<a class="dj-auth-provider" href="{{ p.login_url }}{% if next %}{% if '?' in p.login_url %}&amp;{% else %}?{% endif %}next={{ next|urlencode }}{% endif %}"><span class="dj-auth-provider-icon" aria-hidden="true">{{ p.id|auth_provider_icon }}</span><span>{% if step == "signup" %}Sign up with{% else %}Continue with{% endif %} {{ p.label }}</span></a>{% endfor %}</div>{% endif %}

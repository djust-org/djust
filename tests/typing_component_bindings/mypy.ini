[mypy]
python_version = 3.12
strict = True
explicit_package_bases = True
ignore_errors = False
mypy_path = ../../python
follow_imports = silent

[mypy-django.*]
ignore_missing_imports = True
# Preserve real Django base-class attributes instead of inheriting Any.
# Imported dependency bodies remain silent; fixture diagnostics remain strict.
follow_untyped_imports = True

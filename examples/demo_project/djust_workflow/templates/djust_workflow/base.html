{% load live_tags %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>{% block title %}Tickets{% endblock %}</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; background: #fafafa; }
        main { padding: 20px; max-width: 760px; margin: 0 auto; }
        .error { color: #b91c1c; }
        .ok { color: #166534; }
        .muted { color: #6b7280; }
        .loading { display: none; }
        li { margin: 6px 0; }
    </style>
    {% djust_client_config %}
</head>
<body>
    <main>{% block content %}{% endblock %}</main>
</body>
</html>

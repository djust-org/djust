[package]
name = "djust_templates"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
indexmap = { workspace = true }
pyo3.workspace = true
serde.workspace = true
serde_json.workspace = true
ahash.workspace = true
smallvec.workspace = true
regex.workspace = true
once_cell.workspace = true
thiserror.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
tracing = { workspace = true }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
djust_core = { path = "../djust_core" }
djust_vdom = { path = "../djust_vdom" }
djust_components = { path = "../djust_components" }

[dev-dependencies]
criterion = "0.8"
tempfile = "3.27"
# Lexes this crate's own source for the `value_to_json` structural pin (#2249).
# A pin that greps RAW text counts comments as code; `proc-macro2` is Rust's own
# lexer, so a comment is gone before the pin sees it and a string literal is one
# opaque token. Test-only, and already in the lockfile via `pyo3-macros` — no new
# supply-chain surface. Works outside a proc macro via its fallback backend,
# which is the use case the crate exists for.
proc-macro2 = "1.0"

[[bench]]
name = "variable_extraction"
harness = false

[[bench]]
name = "tag_registry"
harness = false

[[bench]]
name = "loop_render_cache"
harness = false

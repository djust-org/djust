name: Pre-Release Security Audit

# Security scans that GATE every PyPI publish.
#
# This is a reusable workflow. release.yml (tag push) and publish.yml (release
# published / manual) call it as a job that their publish jobs `need`, so a
# failing audit stops the release before anything reaches PyPI or GitHub
# Releases. It has no push trigger of its own any more — on a tag it runs once,
# inside the release run. It can still be dispatched by hand on any ref.
#
# Every scanner is blocking. Each has a reviewed allowlist:
#   Bandit      the `-s`/`-x` skip set below (same as the pre-commit hook)
#   pip-audit   .github/security/pip-audit-ignore.txt (scripts/pip-audit-gate.py)
#   cargo-audit .cargo/audit.toml `ignore` (vulnerabilities + unsound deny;
#               unmaintained/yanked stay warnings)
#   npm audit   none — fails on high/critical (`--audit-level=high`)
#   clippy      fails on correctness/suspicious lints (-D), warns on the rest
#   ESLint      fails on errors, tolerates warnings
#   CodeQL      .github/codeql/codeql-config.yml + alert dismissals; fails on
#               open high/critical alerts on the analysed ref
# Audit Summary always writes the report, then fails if any scanner failed.
on:
  workflow_call:
    inputs:
      version:
        description: 'Version being audited (default: derived from the tag ref)'
        required: false
        default: ''
        type: string
      create_issue:
        description: 'Create a tracking issue from audit results'
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: 'Version being audited (e.g., 0.3.0)'
        required: false
        type: string
      create_issue:
        description: 'Create a tracking issue from audit results'
        required: false
        default: true
        type: boolean

# Least privilege by default; the jobs that need more ask for it. A caller
# must grant at least `contents: read`, `issues: write` and
# `security-events: write` to the job that uses this workflow.
permissions:
  contents: read

# No workflow-level concurrency group: when called, a group here would be
# shared by every caller, and a queued audit can be cancelled by a newer one —
# which would fail (block) the release that was waiting on it. The callers
# serialise releases themselves.

# Disable ANSI color across all tools so console logs stay readable (no raw
# escape sequences). CARGO_TERM_COLOR covers cargo/clippy/cargo-audit; NO_COLOR
# is honored by eslint and most modern CLIs. Full detail is still captured in
# the uploaded *-report.md artifacts.
env:
  CARGO_TERM_COLOR: never
  NO_COLOR: "1"

jobs:
  # --- Python security scanning ---
  python-security:
    name: Python Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Nothing here needs djust installed (Bandit reads source, pip-audit
      # reads uv.lock), so the job no longer builds the Rust extension.
      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Run Bandit (full scan, advisory)
        id: bandit
        run: |
          echo "## Bandit Results" > bandit-report.md
          echo '```' >> bandit-report.md
          echo "::group::Bandit full output"
          uvx bandit -r python/djust/ -ll -f txt 2>&1 | tee -a bandit-report.md || true
          echo "::endgroup::"
          echo '```' >> bandit-report.md

          # Also produce JSON for machine-readable output
          uvx bandit -r python/djust/ -ll -f json -o bandit-results.json || true

      # Blocking gate: FAIL the job on any NEW high-severity Bandit finding.
      # Uses the repo's reviewed skip list (the same `-s`/`-x` set the
      # pre-commit `bandit` hook uses — single source of truth) so the gate
      # measures against a 0-HIGH/0-MEDIUM reviewed baseline. Findings that
      # the codebase has already reviewed and intentionally accepted are:
      #   B703,B308  mark_safe — expected in a templating framework
      #   B324       MD5 — used only for non-security cache keys
      #   B301       pickle — JIT function caching
      #   B102       exec — JIT code generation
      # and the test trees (tests/, python/tests/, python/djust/tests/) are
      # excluded (e.g. a B613 bidi-char fixture in an upload-safety test).
      # Any high-severity finding OUTSIDE those reviewed exceptions is NEW and
      # blocks the release. To accept a new finding, add an explicit `# nosec`
      # with justification or extend the skip list in BOTH the pre-commit hook
      # and this step — do not weaken the gate.
      - name: Bandit high-severity gate (blocking)
        run: |
          set -euo pipefail
          # -lll = report ONLY high-severity; reviewed skips applied so the
          # baseline is 0 high-severity. Emit JSON regardless of exit code,
          # then count high-severity results ourselves (robust vs exit codes).
          uvx bandit -r python/djust \
            -lll -ii \
            -x tests/,python/tests/,python/djust/tests/ \
            -s B703,B308,B324,B301,B102 \
            -f json -o bandit-high.json || true
          HIGH=$(python -c "import json; d=json.load(open('bandit-high.json')); print(sum(1 for r in d['results'] if r['issue_severity']=='HIGH'))")
          echo "Bandit high-severity findings (after reviewed skips): $HIGH"
          if [ "$HIGH" -gt 0 ]; then
            echo "::error::Bandit found $HIGH NEW high-severity issue(s). See bandit-high.json / bandit-report.md."
            python -c "import json; d=json.load(open('bandit-high.json')); [print(f\"  {r['test_id']} {r['filename']}:{r['line_number']} {r['issue_text']}\") for r in d['results'] if r['issue_severity']=='HIGH']"
            exit 1
          fi
          echo "OK: 0 new high-severity Bandit findings."

      # Blocking gate: FAIL on any known vulnerability in a package pinned in
      # uv.lock (every extra, every Python/platform fork) that is not in the
      # reviewed allowlist .github/security/pip-audit-ignore.txt, and on any
      # allowlist entry past its review-by date. djust itself is excluded: it
      # is not on PyPI until this release publishes. (Safety was removed — its
      # free database lags pip-audit's PyPI/OSV data; it reported 0 findings
      # on the v1.1.4 audit where pip-audit reported 8.)
      - name: pip-audit gate (blocking)
        id: pip_audit
        run: python scripts/pip-audit-gate.py --report pip-audit-report.md

      - name: Upload Python security reports
        # Upload even when the high-severity gate blocks the job, so a new
        # finding can be triaged from the artifacts.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-security-reports
          path: |
            bandit-report.md
            bandit-results.json
            bandit-high.json
            pip-audit-report.md

  # --- Rust security scanning ---
  rust-security:
    name: Rust Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # The key carries the version: `command -v` below skips the install
      # whenever the cache restores a binary, so a stale key pins a stale
      # cargo-audit (and its .cargo/audit.toml schema) forever.
      - name: Cache cargo-audit
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-0.22

      - name: Install cargo-audit
        run: command -v cargo-audit || cargo install cargo-audit --locked --version '~0.22'

      # Blocking gate: FAIL on any vulnerability, and on any `unsound`
      # advisory, not in .cargo/audit.toml's reviewed `ignore` list. The
      # config sets `deny = ["unsound"]`; the flag repeats it so the gate
      # does not depend on the config being found. Unmaintained / yanked
      # crates are reported as warnings.
      - name: cargo-audit gate (blocking)
        id: cargo_audit
        run: |
          set -o pipefail
          echo "## cargo-audit Results" > cargo-audit-report.md
          echo '```' >> cargo-audit-report.md
          status=0
          echo "::group::cargo-audit full output"
          cargo audit --deny unsound 2>&1 | tee -a cargo-audit-report.md || status=$?
          echo "::endgroup::"
          echo '```' >> cargo-audit-report.md

          # JSON output for machine parsing
          cargo audit --json > cargo-audit-results.json 2>/dev/null || true
          if [ "$status" -ne 0 ]; then
            echo "::error::cargo-audit found a vulnerability or unsound advisory that is not in .cargo/audit.toml's ignore list."
          fi
          exit $status

      # Blocking: -D lints (correctness, suspicious) fail the job; -W lints
      # are reported only. Runs even when cargo-audit failed so both reports
      # are available.
      - name: Run clippy with security-relevant lints (fails on -D lints)
        if: success() || failure()
        run: |
          set -o pipefail
          # Set up Python for PyO3
          sudo apt-get update && sudo apt-get install -y python3-dev
          export PYO3_PYTHON=$(which python3)

          echo "## Clippy Security Lints" > clippy-report.md
          echo '```' >> clippy-report.md
          status=0
          echo "::group::clippy full output"
          cargo clippy -- \
            -W clippy::all \
            -D clippy::correctness \
            -D clippy::suspicious \
            -W clippy::complexity \
            2>&1 | tee -a clippy-report.md || status=$?
          echo "::endgroup::"
          echo '```' >> clippy-report.md
          exit $status

      - name: Upload Rust security reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-security-reports
          path: |
            cargo-audit-report.md
            cargo-audit-results.json
            clippy-report.md

  # --- JavaScript security scanning ---
  js-security:
    name: JavaScript Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Blocking gate: FAIL on any high or critical advisory in
      # package-lock.json (dev dependencies included — they run in CI and on
      # contributors' machines). Moderate/low are reported, not blocking.
      # There is no allowlist: fix with `npm audit fix` or an `overrides`
      # entry in package.json.
      - name: npm audit gate (blocking on high/critical)
        id: npm_audit
        run: |
          set -o pipefail
          echo "## npm audit Results" > npm-audit-report.md
          echo '```' >> npm-audit-report.md
          npm audit --json > npm-audit-results.json 2>/dev/null || true
          status=0
          echo "::group::npm audit full output"
          npm audit --audit-level=high 2>&1 | tee -a npm-audit-report.md || status=$?
          echo "::endgroup::"
          echo '```' >> npm-audit-report.md
          if [ "$status" -ne 0 ]; then
            echo "::error::npm audit found a high or critical advisory."
          fi
          exit $status

      - name: Run ESLint (fails on errors, tolerates warnings)
        if: success() || failure()
        run: |
          # eslint exits non-zero ONLY on errors (severity 2) by default;
          # warnings (severity 1) leave the exit code at 0. set -o pipefail lets
          # the eslint exit code survive the `tee` so a real error (e.g. an XSS
          # / no-script-url regression) FAILS this step instead of being
          # swallowed by `|| true`. The full report artifact is still written.
          set -o pipefail
          echo "## ESLint Security Results" > eslint-report.md
          echo '```' >> eslint-report.md
          status=0
          echo "::group::eslint full output"
          npm run lint 2>&1 | tee -a eslint-report.md || status=$?
          echo "::endgroup::"
          echo '```' >> eslint-report.md
          exit $status

      - name: Upload JS security reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: js-security-reports
          path: |
            npm-audit-report.md
            npm-audit-results.json
            eslint-report.md

  # --- CodeQL analysis ---
  codeql:
    name: CodeQL Deep Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      # A cancelled leg would leave the gate below without its analysis.
      fail-fast: false
      matrix:
        language: [python, javascript]
    steps:
      - uses: actions/checkout@v7

      # Same reviewed config as codeql.yml (djust sanitizer models, source
      # fragment + test-path exclusions, and the reviewed rule exclusions).
      # Without it the pre-release analysis reported every excluded rule
      # again (15 high alerts on refs/tags/v1.2.0, all js/xss,
      # js/remote-property-injection or test-path findings).
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          config-file: .github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}/pre-release"

  # Blocking gate: FAIL when the analysed ref has open high/critical CodeQL
  # alerts. The analyze step waits for GitHub to process the upload, so the
  # alerts API already reflects it. `github.ref` is the ref the analyses were
  # uploaded under — the tag (refs/tags/vX.Y.Z) when release.yml calls this on
  # a tag push. The script first checks both analyses for this commit exist on
  # that ref, so a ref mismatch fails instead of reading as "no alerts".
  codeql-gate:
    name: CodeQL alert gate
    needs: [codeql]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@v7

      - name: Fail on open high/critical alerts
        env:
          GH_TOKEN: ${{ github.token }}
          CODEQL_EXPECT_SHA: ${{ github.sha }}
          CODEQL_EXPECT_CATEGORIES: /language:python/pre-release,/language:javascript/pre-release
        run: |
          status=0
          bash scripts/codeql-alert-gate.sh "$GITHUB_REF" "$GITHUB_REPOSITORY" > codeql-gate.log 2>&1 || status=$?
          cat codeql-gate.log
          {
            echo "## CodeQL alert gate"
            echo '```'
            cat codeql-gate.log
            echo '```'
          } > codeql-gate-report.md
          exit "$status"

      - name: Upload CodeQL gate report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codeql-security-reports
          path: codeql-gate-report.md

  # --- Aggregate results and create tracking issue ---
  audit-summary:
    name: Audit Summary
    needs: [python-security, rust-security, js-security, codeql, codeql-gate]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Only this workflow's reports: when called from release.yml the run
      # also holds the wheel/sdist artifacts.
      - name: Download all reports
        uses: actions/download-artifact@v8
        with:
          pattern: '*-security-reports'
          path: reports
          merge-multiple: true

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "version=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT
          fi

      - name: Generate summary report
        id: summary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          REPORT="audit-summary.md"

          cat > "$REPORT" << 'HEADER'
          # Pre-Release Security Audit Summary
          HEADER
          echo "**Version:** ${VERSION}" >> "$REPORT"
          echo "**Date:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$REPORT"
          echo "**Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> "$REPORT"
          echo "" >> "$REPORT"

          echo "## Job Results" >> "$REPORT"
          echo "" >> "$REPORT"
          echo "| Scanner | Status |" >> "$REPORT"
          echo "|---------|--------|" >> "$REPORT"
          echo "| Python Security (bandit, pip-audit) | ${{ needs.python-security.result }} |" >> "$REPORT"
          echo "| Rust Security (cargo-audit, clippy) | ${{ needs.rust-security.result }} |" >> "$REPORT"
          echo "| JavaScript Security (npm audit, eslint) | ${{ needs.js-security.result }} |" >> "$REPORT"
          echo "| CodeQL Analysis | ${{ needs.codeql.result }} |" >> "$REPORT"
          echo "| CodeQL alert gate (high/critical) | ${{ needs.codeql-gate.result }} |" >> "$REPORT"
          echo "" >> "$REPORT"

          # Append individual reports if they exist
          echo "## Detailed Reports" >> "$REPORT"
          echo "" >> "$REPORT"
          for f in reports/*.md; do
            if [ -f "$f" ]; then
              cat "$f" >> "$REPORT"
              echo "" >> "$REPORT"
            fi
          done

          # Write to GitHub step summary
          cat "$REPORT" >> $GITHUB_STEP_SUMMARY

      - name: Create tracking issue
        # Only when create_issue is true: a manual dispatch defaults it to
        # true, a caller (release.yml / publish.yml) defaults it to false.
        # The old `inputs.create_issue == ''` clause was a footgun: GHA
        # coerces a boolean `false` and `''` both to 0, so `false == ''` was
        # TRUE and the step ran even when create_issue=false was passed.
        # `== true` alone is correct. Runs even when a scanner failed — a
        # failed audit is exactly when the tracking issue is wanted.
        if: always() && inputs.create_issue == true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const version = '${{ steps.version.outputs.version }}';

            // Read the audit template
            let body = '';
            try {
              body = fs.readFileSync('.github/SECURITY_AUDIT_TEMPLATE.md', 'utf8');
            } catch (e) {
              body = '## Security Audit\nNo template found. See workflow artifacts for scan results.';
            }

            // Replace version placeholder
            body = body.replace(/\{\{VERSION\}\}/g, version);

            // Append automated scan results
            let summary = '';
            try {
              summary = fs.readFileSync('audit-summary.md', 'utf8');
            } catch (e) {
              summary = 'Automated scan summary not available. Check workflow artifacts.';
            }
            body += '\n\n---\n\n## Automated Scan Results\n\n' + summary;

            // GitHub rejects issue bodies over 65536 chars (HTTP 422). The
            // aggregated scan summary can exceed that, so cap the body and
            // point to the uploaded `security-audit-report` artifact (which
            // always carries the full, untruncated detail).
            const MAX_BODY = 65000;
            if (body.length > MAX_BODY) {
              const note = '\n\n---\n\n_Body truncated to fit GitHub\'s 65536-character issue limit. Full scan output is in the `security-audit-report` workflow artifact for this run._';
              body = body.slice(0, MAX_BODY - note.length) + note;
            }

            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Security Audit: v${version}`,
              body: body,
              labels: ['security', 'audit', 'release']
            });

            core.notice(`Created security audit issue: ${issue.html_url}`);

      - name: Upload full audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-audit-report
          path: audit-summary.md

      # The summary job runs `if: always()`, so without this step it would
      # succeed even when a scanner failed — and a caller gating on this
      # workflow would see only the scanners' own results. Fail last, after
      # the report, issue and artifact are written.
      - name: Fail if any scanner failed or was cancelled
        if: always()
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          bad="$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<<"$RESULTS")"
          if [ -n "$bad" ]; then
            while IFS= read -r line; do echo "::error::$line"; done <<<"$bad"
            exit 1
          fi
          echo "OK: every scanner succeeded."

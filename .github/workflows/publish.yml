name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      test_pypi:
        description: 'Publish to Test PyPI instead of PyPI'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

jobs:
  # Pre-release security audit — publish needs it, so this manual/secondary
  # publish path is gated exactly like release.yml's. (A release created by
  # release.yml uses GITHUB_TOKEN and does not trigger this workflow.)
  security-audit:
    name: Pre-release security audit
    uses: ./.github/workflows/pre-release-security-audit.yml
    permissions:
      contents: read
      issues: write
      security-events: write

  # Build Linux wheels using manylinux container
  build-linux:
    name: Build Linux wheels
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          manylinux: auto
          args: --release --strip -i python${{ matrix.python-version }}

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel-linux-py${{ matrix.python-version }}
          path: target/wheels/*.whl

  # Build macOS wheels
  build-macos:
    name: Build macOS wheels
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          args: --release --strip

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel-macos-py${{ matrix.python-version }}
          path: target/wheels/*.whl

  # Build Windows wheels
  build-windows:
    name: Build Windows wheels
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          args: --release --strip

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel-windows-py${{ matrix.python-version }}
          path: target/wheels/*.whl

  # Build source distribution
  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  # Publish to PyPI
  publish:
    name: Publish to PyPI
    needs: [build-linux, build-macos, build-windows, build-sdist, security-audit]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/djust
    permissions:
      id-token: write  # Required for trusted publishing

    steps:
      # Distributions only: the audit's report artifacts share this run.
      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      - name: List artifacts
        run: ls -la dist/

      - name: Publish to Test PyPI
        if: github.event.inputs.test_pypi == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # Skip files that already exist (handles partial uploads/retries)
          skip-existing: true

      - name: Publish to PyPI
        if: github.event.inputs.test_pypi != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Skip files that already exist (handles partial uploads/retries)
          skip-existing: true

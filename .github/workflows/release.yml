name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

# Prevent concurrent releases
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Pre-release security audit — the gate. Runs in parallel with verify/build
  # (it only reads the tree), and github-release + pypi-publish `need` it, so a
  # failing scanner stops the release before anything is published. This is
  # the audit's only tag-push run: the audit workflow no longer has a push
  # trigger of its own. See the header of pre-release-security-audit.yml for
  # what each scanner blocks on and where its allowlist lives.
  security-audit:
    name: Pre-release security audit
    uses: ./.github/workflows/pre-release-security-audit.yml
    # A called workflow can only narrow what its caller grants; these are the
    # maxima its jobs ask for. Job-level, so id-token/contents:write are NOT
    # passed down.
    permissions:
      contents: read
      issues: write
      security-events: write

  # Verify release before building
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Verify tag matches pyproject.toml
        run: |
          TAG_VERSION="${{ steps.version.outputs.version }}"
          PY_VERSION=$(grep '^version = ' pyproject.toml | head -1 | sed 's/version = "//; s/"//')
          echo "Tag version: $TAG_VERSION"
          echo "pyproject.toml version: $PY_VERSION"
          if [ "$TAG_VERSION" != "$PY_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION doesn't match pyproject.toml version $PY_VERSION"
            echo "Run: make version VERSION=$TAG_VERSION"
            exit 1
          fi
          echo "✅ Version verified: $TAG_VERSION"

      - name: Verify CHANGELOG has entry
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Check for version in changelog (handles both 0.2.0a1 and 0.2.0-alpha.1 formats)
          CHANGELOG_VERSION=$(echo "$VERSION" | sed 's/a/-alpha./; s/b/-beta./; s/rc/-rc./')
          if grep -q "## \[$VERSION\]" CHANGELOG.md || grep -q "## \[$CHANGELOG_VERSION\]" CHANGELOG.md; then
            echo "✅ CHANGELOG entry found for $VERSION"
          else
            echo "::warning::No CHANGELOG entry for $VERSION - will use Unreleased section"
          fi

  # Build wheels for multiple platforms
  build:
    needs: [verify]
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # A 3.14t cell must not stop the release (#3074): the verify step installs
    # djust's dependencies on the free-threaded interpreter, and some of them
    # (autobahn via channels[daphne]; cbor2 on macOS x86_64) have no cp314t
    # wheels and build from source. A failed 3.14t cell shows red and ships no
    # cp314t wheel for that platform; every other wheel still publishes.
    continue-on-error: ${{ matrix.python-version == '3.14t' }}
    strategy:
      fail-fast: false  # Continue building other platforms if one fails
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        exclude:
          # Windows builds are slower; only build latest Python versions
          # Users on older Python can use Linux/macOS wheels or build from source
          - os: windows-latest
            python-version: '3.10'
        include:
          # macOS Intel builds (macos-13 is retired, use macos-15-intel)
          - os: macos-15-intel
            python-version: '3.11'
          - os: macos-15-intel
            python-version: '3.12'
          - os: macos-15-intel
            python-version: '3.13'
          - os: macos-15-intel
            python-version: '3.14'
          # macOS ARM - latest (macos-15)
          - os: macos-15
            python-version: '3.11'
          - os: macos-15
            python-version: '3.12'
          - os: macos-15
            python-version: '3.13'
          - os: macos-15
            python-version: '3.14'
          # Free-threaded CPython 3.14t (#3074): cp314-cp314t wheels. The
          # extension declares `gil_used = false`, so importing djust keeps
          # the GIL off; the verify step below fails the build if it doesn't.
          # Four more wheels (~8 MB each) per release: mind PyPI's 10 GB
          # per-project cap, past which uploads land only partially.
          - os: ubuntu-latest
            python-version: '3.14t'
          - os: macos-15
            python-version: '3.14t'
          - os: macos-15-intel
            python-version: '3.14t'
          - os: windows-latest
            python-version: '3.14t'

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install maturin
        run: pip install maturin

      - name: Build wheel
        # `-i python`: build for the interpreter setup-python put first on
        # PATH (for 3.14t, the free-threaded one) rather than whatever
        # maturin discovers.
        run: maturin build --release --out dist -i python

      # A free-threaded wheel must import without CPython re-enabling the GIL
      # (#3074): that is what `#[pymodule(gil_used = false)]` promises, and
      # the reason to publish the wheel at all. orjson has no free-threaded
      # build; djust must not need it (it is only in the `performance` and
      # `dev` extras).
      - name: Verify the free-threaded wheel keeps the GIL off
        if: matrix.python-version == '3.14t'
        shell: bash
        run: |
          python -m pip install dist/*cp314t*.whl
          python -c "import importlib.util, sys; import djust, djust._rust, djust.websocket; assert importlib.util.find_spec('orjson') is None, 'orjson was installed'; assert not sys._is_gil_enabled(), 'importing djust re-enabled the GIL'; print('GIL off:', not sys._is_gil_enabled())"

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl

  # Build source distribution
  sdist:
    name: Build source distribution
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install maturin
        run: pip install maturin

      - name: Build sdist
        run: maturin sdist --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  # Create GitHub Release
  github-release:
    name: Create GitHub Release
    needs: [verify, build, sdist, security-audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Download only the distributions: this run also holds the security
      # audit's report artifacts (*.md / *.json), which must not be attached
      # to the release or handed to the PyPI upload.
      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      - name: Check if pre-release
        id: prerelease
        run: |
          VERSION="${{ needs.verify.outputs.version }}"
          # Match PEP 440 pre-release patterns: 0.2.0a1, 0.2.0b1, 0.2.0rc1, 0.2.0.dev1
          if [[ "$VERSION" =~ (a|b|rc)[0-9]+$ ]] || [[ "$VERSION" =~ \.dev[0-9]+$ ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract changelog for this version
        id: changelog
        run: |
          # Extract the changelog section for this version
          VERSION="${{ needs.verify.outputs.version }}"
          # Handle pre-release versions (e.g., 0.2.0a1 -> 0.2.0-alpha.1 in changelog)
          CHANGELOG_VERSION=$(echo "$VERSION" | sed 's/a/-alpha./; s/b/-beta./; s/rc/-rc./')

          # Extract section from CHANGELOG.md
          awk '/^## \['"$CHANGELOG_VERSION"'\]/{flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md > release_notes.md

          # If not found, try with original version format
          if [ ! -s release_notes.md ]; then
            awk '/^## \['"$VERSION"'\]/{flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md > release_notes.md
          fi

          # If still not found, use Unreleased section
          if [ ! -s release_notes.md ]; then
            awk '/^## \[Unreleased\]/{flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md > release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          body_path: release_notes.md
          generate_release_notes: true

  # Publish to PyPI
  pypi-publish:
    name: Publish to PyPI
    needs: [verify, build, sdist, github-release, security-audit]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/djust
    steps:
      # Distributions only — see github-release.
      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Uses trusted publishing - configure at pypi.org
          # No API token needed when using OIDC
          packages-dir: dist/
          # Skip files that already exist (handles partial uploads/retries)
          skip-existing: true

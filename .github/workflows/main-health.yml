name: main health

# Detect a red `main` proactively, instead of discovering it via a failed push
# (#2139).
#
# `main` carried three failing doc-snippet tests until #2134. Because the
# pre-push hook runs the full suite, EVERY contributor's push was rejected —
# on branches that had nothing to do with the failure. Nothing alerted; the
# state was found only because a push failed, and it took three failed pushes
# to diagnose.
#
# The cost is not the lost minutes. It is that a persistently red suite trains
# people to read red as noise, and to reach for `--no-verify` — the same
# argument as #2124.

on:
  schedule:
    # 07:00 UTC daily — before the working day in most contributor timezones,
    # so a red main is known before anyone tries to push into it.
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

# Two halves (#4074). `suite` is the serial full suite on 3.12: every test, every unit of the
# exhaustive security sweeps (no `-m`, no DJUST_SWEEP_SAMPLE: tests/sweep_sample.py is full). It
# is the ONLY place the full sweeps run. `matrix` calls test.yml, so the interpreter matrix
# (3.13/3.14/3.15) and the Django spread run here, once a day, instead of on every push to main.
# The report job below files one issue for either half, so a nightly failure reaches a human.
# A manual run on another branch tests that branch and fails the run instead of filing an issue.

concurrency:
  group: main-health
  cancel-in-progress: false

jobs:
  suite:
    name: full suite on main
    runs-on: ubuntu-latest
    outputs:
      failed: ${{ steps.run.outputs.failed }}
      summary: ${{ steps.run.outputs.summary }}
      ledger_changed: ${{ steps.ledger.outputs.membership_changed }}
      ledger_summary: ${{ steps.ledger.outputs.summary }}
      ledger_patch: ${{ steps.ledger.outputs.patch }}
    steps:
      # The ref the run is for: `main` on the schedule; the dispatched branch on a manual run.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install uv
          # Mirrors the test.yml Python job installation, rather than
          # inventing a second install recipe. The hand-rolled version failed
          # on its first scheduled run: `uv venv` does not create a `pip`, so
          # `.venv/bin/pip install maturin` had no interpreter to run — and
          # maturin is already a dev dependency, so the line was redundant as
          # well as broken. See #2155.
          uv sync --frozen --extra dev --no-install-project
          # Deliberately NOT `|| true`. A failed Rust build yields hundreds of
          # import errors, which would otherwise be reported as "main is RED"
          # and send people hunting for a test regression that does not exist.
          # Failing here makes it a job failure, which the report job renders
          # as "could not run" — which is exactly what happened, correctly, on
          # the run that surfaced this bug.
          uv run --no-sync maturin develop --release

      - name: Run the suite
        id: run
        env:
          # Arms the collected-count floor (#2746); a shortfall exits non-zero
          # and is reported below as a RED main, with the delta in the log.
          DJUST_COLLECTED_FLOOR: "1"
        run: |
          set +e
          # DELIBERATELY SERIAL — do not add `-n auto` here.
          #
          # pytest-randomly is not installed, so a serial run executes in
          # deterministic definition order. That is a different ordering from
          # xdist's sharding, and an order-dependent bug (a leaked singleton,
          # a module-global mutated by an earlier test) can hide under one
          # while surfacing under the other. #2187 is an open instance.
          #
          # .github/workflows/test.yml runs `-n auto`, and scripts/pre-push-pytest.sh
          # was switched to `-n auto` for wall-clock (330s -> 84s). This job is
          # therefore the ONLY place definition order is still exercised.
          # Parallelising it would close that gap everywhere at once, and the
          # loss would be invisible — the suite would simply keep passing.
          #
          # This is also the right home for it: an ordering flake is a property
          # of `main`, not of whatever branch someone is pushing, so a daily
          # scheduled run reports it to the person who can act on it instead of
          # blocking an unrelated push.
          uv run --no-sync python -m pytest tests/ python/tests/ python/djust/tests/ -q \
            --junitxml=/tmp/suite-junit.xml > /tmp/suite.txt 2>&1
          STATUS=$?
          set -e
          tail -40 /tmp/suite.txt

          # The failing test IDs are what a reader needs; the summary line
          # alone does not say WHICH tests, and that is the information the
          # pre-push hook also buries. Split at the first " - " outside
          # brackets, matching scripts/pre-push-pytest.sh — a node id can
          # contain " - " only inside its [parameters].
          FAILED=$(grep -E '^FAILED ' /tmp/suite.txt | sed 's/^FAILED //' | awk '{
            depth = 0
            for (i = 1; i <= length($0); i++) {
              c = substr($0, i, 1)
              if (c == "[") depth++
              else if (c == "]") { if (depth > 0) depth-- }
              else if (depth == 0 && substr($0, i, 3) == " - ") { print substr($0, 1, i - 1); next }
            }
            print $0
          }' | head -25 || true)
          SUMMARY=$(grep -E '[0-9]+ (passed|failed)' /tmp/suite.txt | tail -1 || true)

          # No parseable summary means pytest did not get far enough to have an
          # opinion (collection error, missing extension, OOM). That is "could
          # not run", not "main is RED" — reporting it as a test regression
          # sends people hunting for a bug that does not exist.
          if [ -z "$SUMMARY" ]; then
            echo "No parseable pytest summary — treating as an infrastructure failure."
            exit 1
          fi

          {
            echo "failed=$([ "$STATUS" -eq 0 ] && echo false || echo true)"
            echo "summary<<EOF"
            echo "$SUMMARY"
            echo ""
            echo "$FAILED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          exit 0

      # The promotion ledger (tests/early_tier.py, scripts/promotion_ledger.py): a test that failed
      # here and is not in the pre-merge tier is promoted, so PR CI runs it from then on; a green
      # night credits every entry that passed, and one green for DEMOTE_AFTER_GREEN nights leaves.
      # This job cannot push (`contents: read`), and must never push to main: the change is a
      # patch, which the report job posts on the "main is RED" issue (promotion) or on the
      # "promotion ledger: changes to apply" issue (demotion), for a person to apply in a PR.
      # The green streaks between nights live in the actions cache, which needs no token
      # permission; a lost cache only restarts the streaks (an entry stays early longer).
      - name: Restore the promotion-ledger streaks
        if: ${{ steps.run.outcome == 'success' }}
        uses: actions/cache/restore@v6
        with:
          path: .promotion-state/ledger.json
          key: promotion-ledger-state-${{ github.run_id }}
          restore-keys: promotion-ledger-state-

      - name: Update the promotion ledger
        id: ledger
        if: ${{ steps.run.outcome == 'success' }}
        env:
          FAILED: ${{ steps.run.outputs.failed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ ! -s /tmp/suite-junit.xml ]; then
            echo "no junit report; the ledger is left as it is"
            exit 0
          fi
          if [ "$FAILED" = "true" ]; then
            set -- promote --reason "failed in the nightly main-health suite: $RUN_URL"
          else
            set -- demote
          fi
          uv run --no-sync python scripts/promotion_ledger.py "$@" \
            --junit /tmp/suite-junit.xml --state .promotion-state/ledger.json \
            --summary /tmp/ledger-summary.md
          {
            echo "summary<<LEDGER_EOF"
            cat /tmp/ledger-summary.md
            echo "LEDGER_EOF"
            echo "patch<<LEDGER_EOF"
            git diff -- tests/promotion-ledger.json
            echo "LEDGER_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Save the promotion-ledger streaks
        # Best effort: a failed save (a re-run attempt reuses the run id) only restarts streaks.
        continue-on-error: true
        if: ${{ steps.ledger.outcome == 'success' && github.ref == 'refs/heads/main' && hashFiles('.promotion-state/ledger.json') != '' }}
        uses: actions/cache/save@v6
        with:
          path: .promotion-state/ledger.json
          key: promotion-ledger-state-${{ github.run_id }}

  matrix:
    name: cross-version matrix (test.yml)
    uses: ./.github/workflows/test.yml
    with:
      # main-health's `suite` above already sweeps every unit once; the matrix samples.
      full_sweeps: false

  report:
    name: open or update the tracking issue
    needs: [suite, matrix]
    # Runs even when `suite` FAILED. Without this, a job-level failure — a
    # broken `uv venv`, a network blip, a Rust build error — skips the report
    # entirely and nobody is told. "Nothing alerted" is the failure mode this
    # workflow exists to remove, so it must not reproduce it when its own setup
    # breaks.
    #
    # `!cancelled()` rather than `always()`: a cancelled run tells us nothing,
    # and `always()` would file a spurious "could not run" issue for every
    # cancelled workflow_dispatch.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Open, update, or close the main-health issue
        uses: actions/github-script@v8
        env:
          FAILED: ${{ needs.suite.outputs.failed }}
          SUMMARY: ${{ needs.suite.outputs.summary }}
          SUITE_RESULT: ${{ needs.suite.result }}
          MATRIX_RESULT: ${{ needs.matrix.result }}
          ON_MAIN: ${{ github.ref == 'refs/heads/main' }}
          LEDGER_CHANGED: ${{ needs.suite.outputs.ledger_changed }}
          LEDGER_SUMMARY: ${{ needs.suite.outputs.ledger_summary }}
          LEDGER_PATCH: ${{ needs.suite.outputs.ledger_patch }}
        with:
          script: |
            // Three states, not two: green, red, and "the check could not
            // run". Reporting an infrastructure failure as "main is RED"
            // sends people hunting for a test regression that does not exist.
            const outcome = process.env.SUITE_RESULT;
            const ranAtAll = outcome === 'success';
            const infraFailure = !ranAtAll;
            // The cross-version matrix (#4074) is red when any of its gating jobs failed; a
            // 3.15 cell is allowed to fail and does not make it red.
            const matrixRed = process.env.MATRIX_RESULT === 'failure';
            const failed = infraFailure || process.env.FAILED === 'true' || matrixRed;
            const matrixLine = matrixRed
              ? 'The cross-version matrix (test.yml on 3.12-3.15 x Django 5.2-6.1) FAILED: see its jobs in the run.'
              : `Cross-version matrix: ${process.env.MATRIX_RESULT || 'not run'}.`;
            const summary = (process.env.SUMMARY || '(no summary captured)') + '\n\n' + matrixLine;
            // The promotion ledger (tests/early_tier.py): a patch for a person to apply in a PR.
            const ledgerChanged = process.env.LEDGER_CHANGED === 'true' && !!process.env.LEDGER_PATCH;
            const ledgerBlock = ledgerChanged ? [
              '### Promotion ledger',
              '',
              process.env.LEDGER_SUMMARY || '',
              'Apply in a pull request (save the diff below as `ledger.patch`, then `git apply ledger.patch`);',
              'never pushed to main by this workflow. See docs/testing-strategy.md, "The early tier".',
              '',
              '```diff',
              process.env.LEDGER_PATCH,
              '```',
            ].join('\n') : '';
            // A manual run on a branch reports in the run, not in the tracking issue.
            if (process.env.ON_MAIN !== 'true') {
              core.summary.addRaw(ledgerBlock ? summary + '\n\n' + ledgerBlock : summary);
              await core.summary.write();
              if (failed) core.setFailed(`branch run is red: ${summary}`);
              return;
            }
            const LABEL = 'main-health';
            const RED_TITLE = 'main is RED — the full suite fails on main';
            const INFRA_TITLE = 'main-health check could not run';
            const TITLE = infraFailure ? INFRA_TITLE : RED_TITLE;
            const OTHER_TITLE = infraFailure ? RED_TITLE : INFRA_TITLE;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Match on TITLE, not on the label. Labels can be dropped silently
            // (GitHub drops unknown labels for actors without push access, and
            // the label can simply be deleted), and a re-find that depends on
            // one turns this into a daily duplicate-issue generator with
            // nothing ever closed.
            //
            // Paginated: the default page is 30 and the issues API includes
            // PRs, so an ageing tracking issue would eventually fall off the
            // first page and be recreated daily.
            const all = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', per_page: 100,
            });
            const find = (t) => all.find(i => i.title === t && !i.pull_request);
            const existing = find(TITLE);
            const stale = find(OTHER_TITLE);

            const close = async (issue, why) => {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, body: `${why} as of ${run}. Closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: 'closed',
              });
            };

            // The other title's issue is stale once we have a DEFINITE answer.
            // Not when infra failed: "we cannot tell" is no reason to close a
            // red-main issue that may well still be accurate.
            if (!infraFailure && stale) {
              await close(stale, 'Superseded — the check ran and reported a definite state');
            }

            // Demotions are proposed on a green night, on their own issue (the red one closes).
            const LEDGER_TITLE = 'promotion ledger: changes to apply';
            const ledgerIssue = find(LEDGER_TITLE);
            if (!failed && ledgerChanged) {
              const ledgerBody = [
                ledgerBlock,
                '',
                `Run: ${run}`,
                '',
                '_Opened automatically by `.github/workflows/main-health.yml`. Updated on each green',
                'run that still proposes a change; closed when the checked-in ledger needs none._',
              ].join('\n');
              if (ledgerIssue) {
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: ledgerIssue.number, body: ledgerBody,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner, repo: context.repo.repo,
                  title: LEDGER_TITLE, labels: [LABEL], body: ledgerBody,
                });
              }
            } else if (!failed && ledgerIssue) {
              await close(ledgerIssue, 'The checked-in promotion ledger needs no change');
            }

            if (!failed) {
              if (existing) await close(existing, 'main is green again');
              return;
            }

            // Why the body leads with the blast radius rather than the trace:
            // the reader most likely to open this is someone whose unrelated
            // push just bounced, and the first thing they need to know is
            // that it was not them.
            const body = infraFailure ? [
              '**The main-health check could not run** — the job failed before or during setup',
              '(dependency install, toolchain, or runner), or pytest produced no parseable summary.',
              'This is NOT evidence that main is red; it is evidence that we currently cannot tell.',
              '',
              `Run: ${run}`,
            ].join('\n') : [
              '**Every push is blocked while this is open.** The pre-push hook runs the full suite,',
              'so a red `main` rejects branches that have nothing to do with the failure.',
              '',
              'If your push just bounced: run `bash scripts/pre-push-pytest.sh` — it re-runs only',
              'the failing tests against your merge-base and tells you which failures are yours.',
              'Do **not** reach for `--no-verify`.',
              '',
              '```',
              summary,
              '```',
              '',
              ...(ledgerBlock ? [ledgerBlock, ''] : []),
              `Run: ${run}`,
              '',
              '_Opened automatically by `.github/workflows/main-health.yml` (#2139). It updates this',
              'issue on each subsequent red run and closes it when main goes green._',
            ].join('\n');

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: TITLE, labels: [LABEL], body,
              });
            }

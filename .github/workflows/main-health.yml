name: main health

# Detect a red `main` proactively, instead of discovering it via a failed push
# (#2139).
#
# `main` carried three failing doc-snippet tests until #2134. Because the
# pre-push hook runs the full suite, EVERY contributor's push was rejected —
# on branches that had nothing to do with the failure. Nothing alerted; the
# state was found only because a push failed, and it took three failed pushes
# to diagnose.
#
# The cost is not the lost minutes. It is that a persistently red suite trains
# people to read red as noise, and to reach for `--no-verify` — the same
# argument as #2124.

on:
  schedule:
    # 07:00 UTC daily — before the working day in most contributor timezones,
    # so a red main is known before anyone tries to push into it.
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: main-health
  cancel-in-progress: false

jobs:
  suite:
    name: full suite on main
    runs-on: ubuntu-latest
    outputs:
      failed: ${{ steps.run.outputs.failed }}
      summary: ${{ steps.run.outputs.summary }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv venv
          uv pip install -e ".[dev]" || uv pip install -e .
          .venv/bin/pip install maturin
          # Deliberately NOT `|| true`. A failed Rust build yields hundreds of
          # import errors, which would otherwise be reported as "main is RED"
          # and send people hunting for a test regression that does not exist.
          # Failing here makes it a job failure, which the report job renders
          # as "could not run".
          .venv/bin/maturin develop --release

      - name: Run the suite
        id: run
        run: |
          set +e
          .venv/bin/python -m pytest tests/ python/tests/ python/djust/tests/ -q \
            > /tmp/suite.txt 2>&1
          STATUS=$?
          set -e
          tail -40 /tmp/suite.txt

          # The failing test IDs are what a reader needs; the summary line
          # alone does not say WHICH tests, and that is the information the
          # pre-push hook also buries. Split at the first " - " outside
          # brackets, matching scripts/pre-push-pytest.sh — a node id can
          # contain " - " only inside its [parameters].
          FAILED=$(grep -E '^FAILED ' /tmp/suite.txt | sed 's/^FAILED //' | awk '{
            depth = 0
            for (i = 1; i <= length($0); i++) {
              c = substr($0, i, 1)
              if (c == "[") depth++
              else if (c == "]") { if (depth > 0) depth-- }
              else if (depth == 0 && substr($0, i, 3) == " - ") { print substr($0, 1, i - 1); next }
            }
            print $0
          }' | head -25 || true)
          SUMMARY=$(grep -E '[0-9]+ (passed|failed)' /tmp/suite.txt | tail -1 || true)

          # No parseable summary means pytest did not get far enough to have an
          # opinion (collection error, missing extension, OOM). That is "could
          # not run", not "main is RED" — reporting it as a test regression
          # sends people hunting for a bug that does not exist.
          if [ -z "$SUMMARY" ]; then
            echo "No parseable pytest summary — treating as an infrastructure failure."
            exit 1
          fi

          {
            echo "failed=$([ "$STATUS" -eq 0 ] && echo false || echo true)"
            echo "summary<<EOF"
            echo "$SUMMARY"
            echo ""
            echo "$FAILED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          exit 0

  report:
    name: open or update the tracking issue
    needs: suite
    # Runs even when `suite` FAILED. Without this, a job-level failure — a
    # broken `uv venv`, a network blip, a Rust build error — skips the report
    # entirely and nobody is told. "Nothing alerted" is the failure mode this
    # workflow exists to remove, so it must not reproduce it when its own setup
    # breaks.
    #
    # `!cancelled()` rather than `always()`: a cancelled run tells us nothing,
    # and `always()` would file a spurious "could not run" issue for every
    # cancelled workflow_dispatch.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Open, update, or close the main-health issue
        uses: actions/github-script@v8
        env:
          FAILED: ${{ needs.suite.outputs.failed }}
          SUMMARY: ${{ needs.suite.outputs.summary }}
          SUITE_RESULT: ${{ needs.suite.result }}
        with:
          script: |
            // Three states, not two: green, red, and "the check could not
            // run". Reporting an infrastructure failure as "main is RED"
            // sends people hunting for a test regression that does not exist.
            const outcome = process.env.SUITE_RESULT;
            const ranAtAll = outcome === 'success';
            const infraFailure = !ranAtAll;
            const failed = infraFailure || process.env.FAILED === 'true';
            const summary = process.env.SUMMARY || '(no summary captured)';
            const LABEL = 'main-health';
            const RED_TITLE = 'main is RED — the full suite fails on main';
            const INFRA_TITLE = 'main-health check could not run';
            const TITLE = infraFailure ? INFRA_TITLE : RED_TITLE;
            const OTHER_TITLE = infraFailure ? RED_TITLE : INFRA_TITLE;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Match on TITLE, not on the label. Labels can be dropped silently
            // (GitHub drops unknown labels for actors without push access, and
            // the label can simply be deleted), and a re-find that depends on
            // one turns this into a daily duplicate-issue generator with
            // nothing ever closed.
            //
            // Paginated: the default page is 30 and the issues API includes
            // PRs, so an ageing tracking issue would eventually fall off the
            // first page and be recreated daily.
            const all = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', per_page: 100,
            });
            const find = (t) => all.find(i => i.title === t && !i.pull_request);
            const existing = find(TITLE);
            const stale = find(OTHER_TITLE);

            const close = async (issue, why) => {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, body: `${why} as of ${run}. Closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: 'closed',
              });
            };

            // The other title's issue is stale once we have a DEFINITE answer.
            // Not when infra failed: "we cannot tell" is no reason to close a
            // red-main issue that may well still be accurate.
            if (!infraFailure && stale) {
              await close(stale, 'Superseded — the check ran and reported a definite state');
            }

            if (!failed) {
              if (existing) await close(existing, 'main is green again');
              return;
            }

            // Why the body leads with the blast radius rather than the trace:
            // the reader most likely to open this is someone whose unrelated
            // push just bounced, and the first thing they need to know is
            // that it was not them.
            const body = infraFailure ? [
              '**The main-health check could not run** — the job failed before or during setup',
              '(dependency install, toolchain, or runner), or pytest produced no parseable summary.',
              'This is NOT evidence that main is red; it is evidence that we currently cannot tell.',
              '',
              `Run: ${run}`,
            ].join('\n') : [
              '**Every push is blocked while this is open.** The pre-push hook runs the full suite,',
              'so a red `main` rejects branches that have nothing to do with the failure.',
              '',
              'If your push just bounced: run `bash scripts/pre-push-pytest.sh` — it re-runs only',
              'the failing tests against your merge-base and tells you which failures are yours.',
              'Do **not** reach for `--no-verify`.',
              '',
              '```',
              summary,
              '```',
              '',
              `Run: ${run}`,
              '',
              '_Opened automatically by `.github/workflows/main-health.yml` (#2139). It updates this',
              'issue on each subsequent red run and closes it when main goes green._',
            ].join('\n');

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: TITLE, labels: [LABEL], body,
              });
            }

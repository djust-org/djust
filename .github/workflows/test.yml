name: Tests

on:
  push:
    branches: [ main, '1.*' ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'CHANGELOG.md'
  pull_request:
    branches: [ main, '1.*' ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'CHANGELOG.md'

# Cancel superseded runs when commits push rapidly to a branch or PR.
# Force-pushes, dependabot rebases, and quick fixup commits otherwise burn
# the full ~30 compute-min suite on every intermediate revision. Mirrors
# the block in codeql.yml (which has had this since #1340).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege GITHUB_TOKEN (#2523). Every job here only reads the
# checkout; uploading artifacts needs no extra scope. A job that ever has to
# write (post a comment, push a commit) must widen this per-job, explicitly.
permissions:
  contents: read

jobs:
  # Rust tests - runs in parallel
  rust-tests:
    runs-on: ubuntu-latest
    # Build the TEST binaries without LTO and with parallel codegen.
    #
    # `[profile.release]` in Cargo.toml carries `lto = true` + `codegen-units = 1`,
    # which are right for a shipped wheel — compiled once, users pay nothing —
    # and expensive for a binary CI throws away. Measured on this workspace:
    #
    #   profile                       compile   run    total
    #   release (lto, cgu=1)             62s     14s     76s
    #   debug                            31s    186s    217s
    #   release, no LTO, cgu=16          26s     10s     36s
    #
    # `opt-level = 3` is what makes these tests fast — they are compute-heavy
    # (VDOM diffing, template rendering, html5ever parsing), so debug runs them
    # 13x slower and is a net LOSS despite compiling quicker. LTO and
    # `codegen-units = 1` buy almost nothing at run time and cost 2.4x at
    # compile. This job was 234s compiling against 73s running.
    #
    # Set via CARGO_PROFILE_* rather than editing Cargo.toml, so the profile
    # the published wheel is built with is untouched and bit-identical.
    #
    # NOT applied to the `benchmarks` job: it enforces latency thresholds, so it
    # must measure the same binary users get, LTO included.
    env:
      CARGO_PROFILE_RELEASE_LTO: false
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Swatinem/rust-cache keys on rustc version + Cargo.lock + the job
      # context (so rust-tests and python-tests don't poison each other's
      # caches — python-tests builds the PyO3 cdylib, rust-tests builds
      # the workspace libs). Already in use in release.yml:102. Previously
      # this was a hand-rolled actions/cache keyed only on Cargo.lock,
      # which suffered cache misses on rustc bumps and dependency changes.
      - uses: Swatinem/rust-cache@v2

      - name: Set up Python (for PyO3)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Cache Python dependencies (for PyO3)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/uv
            .venv
          key: ${{ runner.os }}-python-minimal-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-python-minimal-
            ${{ runner.os }}-python-

      - name: Install minimal Python deps (for PyO3)
        run: uv sync --no-dev

      - name: Run Rust tests
        run: |
          export PYO3_PYTHON=$(pwd)/.venv/bin/python
          # Phase 1: workspace except djust_live (cdylib link constraint).
          cargo test --workspace --exclude djust_live --release
          # Phase 2: djust_live with extension-module gated off (#1543) so
          # the actor / msgpack / wire-protocol tests in djust_live get
          # genuine Rust-test coverage (not just compile-checks).
          cargo test -p djust_live --no-default-features --release

      - name: Engine without the liveview feature (#2519)
        run: |
          export PYO3_PYTHON=$(pwd)/.venv/bin/python
          # The plain Django-backend engine: no VNode parse cache, no
          # `<!--dj-if-->` markers, no Rust components.
          cargo check -p djust_templates --no-default-features
          # Load-bearing pin (#1859): the feature must actually drop BOTH
          # crates from the graph, or it gates nothing.
          if cargo tree -p djust_templates --no-default-features -e normal --depth 1 | grep -E 'djust_(vdom|components)'; then
            echo "::error::djust_vdom / djust_components still in the no-default-features graph — 'optional = true' lost?"
            exit 1
          fi
          cargo test -p djust_templates --no-default-features --release

      - name: Run Rust linter
        run: |
          export PYO3_PYTHON=$(pwd)/.venv/bin/python
          cargo clippy -- -W clippy::all -D clippy::correctness -D clippy::suspicious

      - name: Check Rust formatting
        run: cargo fmt --check

  # Python tests - runs in parallel with pytest-xdist
  #
  # Matrix-on-PR is the project's #1 minute sink (3 cells × ~10 min each).
  # On PR we run only the canonical interpreter (3.12); on push to main
  # we run the full matrix (3.12/3.13/3.14). 3.13 / 3.14 regressions are
  # caught on the merge commit instead of at PR time — one merge later,
  # not "never". Historical evidence the matrix has value: PRs #450 / #452
  # shipped real 3.14-support fixes. Tradeoff accepted because the absolute
  # cost (~8 min/PR × dependabot volume) outweighed the latency.
  #
  # SHARDED 4-way with pytest-split. Measured on the last completed run
  # before sharding (run 33681681995): this job was 1191s, of which 1005s
  # was the pytest step (21773 items on the runner's 4 xdist workers), 139s
  # was `uv sync` + `maturin develop` (rust-cache full hit; the ~67s of cargo
  # is the workspace crates, which rust-cache does not keep), and ~25s was the
  # lint/type/doc checks. Every other job in this workflow is <= 4 min, so
  # the whole workflow's wall-clock WAS this one step.
  #
  # Each shard runs `--splits 4 --group N` against the committed
  # `.test_durations` (pytest-split balances the groups by recorded
  # duration; `-n auto` still parallelises inside the shard). When the file
  # is missing or stale, pytest-split falls back to splitting by test COUNT
  # — still correct, just less balanced — so a stale file degrades wall-clock,
  # never coverage. Regenerate with `make test-durations` when the suite grows
  # by more than ~10% (see CONTRIBUTING.md "CI shards").
  #
  # Every shard collects the FULL suite and deselects the other groups, so the
  # union of the four is exactly the unsharded collection (pinned by
  # tests/test_ci_python_test_shards.py). The non-pytest steps (fixture
  # freshness, ruff, mypy, ADR/doc/lockfile checks) run on shard 1 only —
  # they are per-checkout, not per-shard, and would be 4x duplicated work.
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ github.event_name == 'push' && fromJSON('["3.12","3.13","3.14"]') || fromJSON('["3.12"]') }}
        group: [1, 2, 3, 4]
    name: python-tests (py${{ matrix.python-version }}, shard ${{ matrix.group }}/4)
    # NOT given rust-tests' CARGO_PROFILE_* override — measured, and it is a
    # LOSS here. Tried on this job and reverted: the build step did drop
    # 118s -> 89s, but the test steps rose 104 -> 112s and 72 -> 91s, so the
    # job went 347s -> 355s.
    #
    # The difference from rust-tests is the ratio. rust-tests is
    # compile-dominated (234s compiling / 73s running), so cheapening the
    # compile wins outright. This job is TEST-dominated (118s building / 176s
    # testing), and its tests run THROUGH the Rust extension — so an extension
    # built without LTO makes every one of them slower, and that costs more
    # than the build saves.
    #
    # Same trade as debug-vs-release, just milder: optimization matters here
    # because the work happens inside Rust.
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # One cache per python-version, SHARED across the four shards: the
      # extension they build is identical, so `shared-key` (which replaces
      # the automatic job-id key) keeps them on one entry instead of four
      # copies. The interpreter version is in the key because pyo3's
      # build-script output in target/ is interpreter-specific. Only shard 1
      # saves; the others restore-only, so four post-steps don't race to
      # write the same key.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: python-tests-py${{ matrix.python-version }}
          save-if: ${{ matrix.group == 1 }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: '${{ matrix.python-version }}'
          allow-prereleases: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Cache Python dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/uv
            .venv
          key: ${{ runner.os }}-python-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-python-

      - name: Install Python dependencies and build extension
        run: |
          uv sync --extra dev
          uv run maturin develop --release

      # pytest-split is also in the [dev] extra; installing it here as well
      # mirrors the existing pytest-xdist belt-and-braces so a stale uv.lock
      # cannot leave a shard without the plugin (pytest would then reject
      # `--splits` as an unknown option and the shard would fail loudly).
      - name: Install test tools
        run: uv pip install pytest-xdist pytest-split mypy

      # Freshness gate for the client-faithful VDOM diff fixtures (#1979): the
      # committed JSON must equal a fresh regen, or the harness pins stale patch
      # output (as it did before #1979). Deterministic generator + this job
      # already uses demo_project.settings, so a diff here is a genuine
      # stale-fixture signal, not env drift.
      - name: VDOM diff fixtures are fresh (#1979)
        if: matrix.group == 1
        run: |
          PYTHONPATH=. .venv/bin/python scripts/gen_vdom_diff_fixtures.py
          # --porcelain (not `git diff --exit-code`) so a NEW scenario's
          # never-`git add`ed output file is caught too, not only modified
          # tracked fixtures (#1980 review).
          DIRTY=$(git status --porcelain -- tests/js/fixtures/)
          if [ -n "$DIRTY" ]; then
            echo "::error::VDOM diff fixtures are stale or uncommitted — run 'make gen-vdom-fixtures' and commit tests/js/fixtures/."
            echo "$DIRTY"
            git diff -- tests/js/fixtures/
            exit 1
          fi

      # ONE invocation over all three roots, not two sequential ones.
      #
      # This was two steps — `tests/ python/tests/` then `python/djust/tests/`.
      # Splitting them costs real wall-clock, because each invocation pays its
      # own startup and collection AND drains its own worker pool: at the end of
      # each run the remaining stragglers hold one worker while the other three
      # idle. Merged, xdist balances stragglers from either set against all four
      # workers. Measured at `-n 4` (what the runner gives):
      #
      #   split:  93s + 43s = 136s
      #   merged:            109s
      #
      # Collection parity was checked before merging, not assumed:
      # 5085 + 5404 = 10489 either way.
      #
      # #2032 / #2034 — python/djust/tests/ MUST stay in this list. It was
      # historically absent from the gating Python step: the explicit paths
      # override pyproject's `testpaths` (which DOES list it), so a large suite
      # (V008 checks, mount-chokepoint structural pins, restore tests) ran in
      # NEITHER CI nor the pre-push hook — and a RED TestSetattrChokepoint
      # CWE-915 guard sat undetected on main. It shipped first as a #1534 SOAK
      # step (continue-on-error), ran GREEN on the main push-CI run at 72d78601,
      # and was promoted to BLOCKING (#2034): a failure here fails python-tests
      # -> fails the test-summary AND-gate (the #1713 promote-into-the-AND rule).
      # Merging the steps preserves that — same invocation, same gate — and
      # tests/test_ci_python_test_roots.py pins all three roots so the omission
      # cannot silently return.
      #
      # Sharded: `--splits 4 --group N` selects this shard's quarter of that
      # ONE collection; all three roots stay in the single invocation, so the
      # #2032 pin above still holds per shard.
      - name: Run Python tests (parallel with pytest-xdist, shard ${{ matrix.group }}/4)
        run: |
          PYTHONPATH=. .venv/bin/python -m pytest tests/ python/tests/ python/djust/tests/ -v -n auto --splits 4 --group ${{ matrix.group }} --durations-path .test_durations

      - name: Run Python linter
        if: matrix.group == 1
        run: uv run ruff check python/

      # mypy type-check — incremental enforcement gate (ADR-023).
      # The pyproject [tool.mypy] config is lenient globally (legacy baseline
      # parked) and STRICT on the strict-island modules (security/*, rate_limit,
      # validation, permissions, the _rust.pyi PyO3 boundary, etc.). It is GREEN
      # by construction, so it ships as a BLOCKING step (no continue-on-error)
      # from its first run, per the #1534 "green-on-first-run → gate" rule. This
      # makes mypy a new MERGE GATE (#1236 governance): a regression in any
      # strict island, or a future module flipped to strict that doesn't pass,
      # fails this step → fails python-tests → fails the test-summary AND-gate.
      - name: Run mypy type-check (ADR-023 strict islands)
        if: matrix.group == 1
        run: .venv/bin/python -m mypy python/djust

      - name: ADR status/version-line consistency (#1501)
        if: matrix.group == 1
        run: .venv/bin/python scripts/check-adr-status.py

      - name: Doc-snippet smoke test + claim assertions (#1500, #1707)
        if: matrix.group == 1
        # Also scans docs/website/guides/*.md for symbol/import resolvability
        # (#1707) — the guard for #1559/#1699's hallucinated djust.tenants
        # symbols. Guides are scanned by default; --no-guides disables.
        run: .venv/bin/python scripts/check-doc-snippets.py

      - name: Generated template-backend support lists are current (#2533)
        if: matrix.group == 1
        # docs/TEMPLATE_BACKEND.md's tag/filter lists are generated from the
        # engine's registries against the installed Django; a stale block
        # fails here. Regenerate with `make template-backend-lists`.
        run: PYTHONPATH=. .venv/bin/python scripts/generate-template-backend-lists.py

      - name: Lockfile self-entry version sync (#1498)
        if: matrix.group == 1
        run: .venv/bin/python scripts/check-lockfile-versions.py

  # Free-threaded (no-GIL) smoke leg - #1534 / follow-up to #1432.
  # Targeted, NOT a full suite run: a 3.14t runner can hit unrelated
  # free-threaded-ecosystem gaps. continue-on-error keeps it non-blocking
  # until it has soaked; promote to blocking in a follow-up once green.
  # NOT wired into the test-summary aggregate gate.
  python-free-threaded:
    runs-on: ubuntu-latest
    continue-on-error: true
    name: python-tests (py3.14t free-threaded)
    # No CARGO_PROFILE_* override, for the same reason as python-tests above.
    # Measured either way: 86s before, 85s with it — no signal, and this job is
    # not on the critical path.
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install free-threaded Python 3.14t
        run: uv python install 3.14t

      - name: Build extension + install test deps (3.14t)
        run: |
          # The [dev] extra pulls orjson, which has no free-threaded build
          # yet (orjson upstream does not support free-threaded Python).
          # orjson is optional for djust at runtime (find_spec + stdlib json
          # fallback), so install only djust core (via maturin develop, which
          # builds the extension and installs the package + its core deps)
          # plus the test runner -- never the full [dev] extra.
          # NOTE: do not use `uv run` here -- it re-manages the project env
          # from pyproject.toml with the default interpreter and would wipe
          # this hand-built 3.14t venv. Activate the venv and call tools
          # directly instead.
          uv venv --python 3.14t
          source .venv/bin/activate
          uv pip install maturin pytest pytest-asyncio
          maturin develop --release

      - name: Free-threaded smoke test (no-GIL assertion)
        run: |
          source .venv/bin/activate
          python -m pytest \
            python/djust/tests/test_rust_module_thread_safety.py -v

  # JavaScript tests - runs in parallel
  javascript-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Bundle init-order static lint (#1372)
        run: node scripts/check-bundle-init-order.mjs

      - name: Bundle cross-IIFE bare-reference static guard (#1706)
        run: node scripts/check-cross-iife-refs.mjs

      - name: Run JavaScript tests
        run: npm test

      - name: Run JavaScript linter (if configured)
        run: |
          if [ -f "package.json" ] && grep -q "lint" package.json; then
            npm run lint || echo "No lint script found, skipping"
          fi

  # Playwright browser tests - runs in parallel (optional, doesn't block CI)
  playwright-tests:
    runs-on: ubuntu-latest
    continue-on-error: true  # Don't fail CI on Playwright test failures
    steps:
      - uses: actions/checkout@v7

      # Shared harness: setup + build + playwright + migrate + start demo on
      # :8002. The djust_check demo dogfood was promoted out of here to its own
      # BLOCKING `demo-checks` job (#1708/#1713); playwright stays non-blocking.
      - name: Set up Playwright server
        uses: ./.github/actions/djust-playwright-server

      - name: Run Playwright tests
        run: |
          echo "Running @loading attribute tests..."
          .venv/bin/python tests/playwright/test_loading_attribute.py
          echo "Running @cache decorator tests..."
          .venv/bin/python tests/playwright/test_cache_decorator.py
          echo "Running DraftMode tests..."
          .venv/bin/python tests/playwright/test_draft_mode.py
          echo "Running nav + dj-hook regression guard (#1742)..."
          .venv/bin/python tests/playwright/test_nav_hooks.py
          # NOTE: the browser-smoke canary (#1849/#1848) was promoted OUT of
          # this non-blocking leg into its own BLOCKING `browser-smoke` job
          # (#1869 / Action Tracker #314) — see below. This `playwright-tests`
          # leg stays non-blocking because the FULL playwright suite
          # (loading_attribute / cache_decorator / draft_mode / nav_hooks) can
          # be flaky; only the stable two-class browser-smoke canary gates.

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-server-logs
          path: examples/demo_project/server.log

      - name: Stop server
        if: always()
        run: |
          if [ -f examples/demo_project/server.pid ]; then
            kill $(cat examples/demo_project/server.pid) || true
            rm examples/demo_project/server.pid
          fi

  # Browser-smoke canary — BLOCKING dedicated job (#1869 / Action Tracker #314,
  # enforces #1534 + #1713). The #1849/#1848 runtime-break canary
  # (tests/playwright/test_browser_smoke.py) drives /demos/browser-smoke/ and
  # guards the 1.0.7 runtime-break class: a LiveView refused at WS mount (a
  # dj-click no-op) and an inline <script> inside the dj-root whose delegated
  # listener never registers under the #1610 mount morph (#1848, fixed by
  # PR #1871). It first shipped as a `continue-on-error` step inside
  # playwright-tests (#1866); now that it has shipped green on the runner across
  # multiple PRs (rc4 retro finding #3: a new CI check exercising an env the dev
  # machine can't fully mirror needs >=1 runner-only iteration before
  # promotion), it is promoted to this dedicated BLOCKING job (no
  # continue-on-error) and wired into the test-summary aggregate gate, so a
  # re-introduced runtime break red-bars the PR. Mirrors the demo-checks
  # blocking-job pattern (#1708/#1713). The OTHER 4 playwright tests stay in the
  # non-blocking `playwright-tests` leg above (the full suite can be flaky;
  # only this stable canary gates).
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same shared harness as playwright-tests / nav-hooks-guard (setup +
      # build + playwright + migrate + start demo on :8002).
      - name: Set up Playwright server
        uses: ./.github/actions/djust-playwright-server

      - name: Run browser-smoke canary (BLOCKING, #1849/#1848)
        run: .venv/bin/python tests/playwright/test_browser_smoke.py

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-smoke-server-logs
          path: examples/demo_project/server.log

      - name: Stop server
        if: always()
        run: |
          if [ -f examples/demo_project/server.pid ]; then
            kill $(cat examples/demo_project/server.pid) || true
            rm examples/demo_project/server.pid
          fi

  nav-hooks-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Shared harness (setup + build + playwright + migrate + start demo on
      # :8002), identical to playwright-tests — the composite keeps the build
      # step from drifting out of one job (#1752 items 1+3).
      - name: Set up Playwright server
        uses: ./.github/actions/djust-playwright-server
      - name: Run nav + dj-hook regression guard
        run: .venv/bin/python tests/playwright/test_nav_hooks.py
      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nav-hooks-server-logs
          path: examples/demo_project/server.log
      - name: Stop server
        if: always()
        run: |
          if [ -f examples/demo_project/server.pid ]; then
            kill $(cat examples/demo_project/server.pid) || true
            rm examples/demo_project/server.pid
          fi

  # Security scanning job — bandit + safety + cargo-audit + npm-audit.
  # Runs on push to main, schedule, and manual dispatch; SKIPPED on PRs.
  #
  # Rationale: this job duplicates the heavier audit that
  # ``pre-release-security-audit.yml`` runs on every tag push — at PR time
  # it was the single longest job in the workflow (~8 min observed) and
  # produced findings ``security-tests`` (pytest-cov) had already gated.
  # Keeping it on push-to-main catches main-branch regressions in
  # security-relevant dependencies the moment they land, without paying
  # the cost on every dependabot rebase / fixup commit.
  #
  # ``security-tests`` (further down) stays on the PR path — it is the
  # pytest-cov leg with the ``--cov-fail-under=75`` gate, which is a real
  # PR-time signal we don't want to drop.
  security-scan:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Cache Python dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/uv
            .venv
          key: ${{ runner.os }}-python-security-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-python-security-
            ${{ runner.os }}-python-

      - name: Install Python dependencies
        run: uv sync --extra dev

      - name: Install security tools
        run: |
          uv pip install bandit safety

      - name: Run Bandit (Python security linter)
        run: |
          # Skip expected patterns: B703/B308 (mark_safe), B324 (MD5 cache keys),
          # B301 (pickle for JIT), B102 (exec for JIT codegen)
          uv run bandit -r python/djust/ -ll -ii -x python/djust/tests/ -s B703,B308,B324,B301,B102

      - name: Run Safety (Python dependency vulnerabilities)
        run: |
          uv run safety check --full-report || echo "Safety check completed with warnings"
        continue-on-error: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo-audit
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-0.21

      - name: Install cargo-audit
        run: command -v cargo-audit || cargo install cargo-audit

      - name: Run cargo-audit (Rust dependency vulnerabilities)
        run: cargo audit || echo "Cargo audit completed with warnings"
        continue-on-error: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run npm audit (JS dependency vulnerabilities)
        run: npm audit --audit-level=high || echo "NPM audit completed with warnings"
        continue-on-error: true

      - name: Run ESLint with security plugin
        run: npm run lint || echo "ESLint completed with warnings"
        continue-on-error: true

  # Security tests with coverage - runs in parallel
  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Cache Python dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/uv
            .venv
          key: ${{ runner.os }}-python-security-tests-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-python-security-tests-
            ${{ runner.os }}-python-

      - name: Install Python dependencies
        run: uv sync --extra dev

      - name: Install coverage tools
        run: uv pip install pytest-cov

      - name: Run security tests with coverage
        run: |
          PYTHONPATH=. .venv/bin/python -m pytest \
            tests/unit/test_security_*.py \
            tests/unit/test_upload_writer.py \
            python/tests/test_security*.py \
            -v \
            --cov=djust.security \
            --cov=djust.uploads \
            --cov=djust.validation \
            --cov-report=term-missing \
            --cov-report=json:coverage-security.json \
            --cov-fail-under=75

      - name: Upload security coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-coverage-report
          path: coverage-security.json

  # Demo djust_check dogfood — BLOCKING dedicated job (#1713, enforces
  # CLAUDE.md #1060). #1683 shipped dead @click buttons to 1.0 GA because
  # the demo templates were never run through djust_check in CI. The dogfood
  # first shipped as a `continue-on-error` step inside playwright-tests
  # (#1708); now that it has shipped green on the runner (rc4 retro finding
  # #3: a new CI check exercising an env the dev machine can't fully mirror
  # needs >=1 runner-only iteration budgeted), it is promoted to this
  # dedicated BLOCKING job (no continue-on-error) and wired into the
  # test-summary aggregate gate, so a re-introduced dead @click / legacy
  # attribute (the #1683 bug class) red-bars the PR.
  #
  # The helper wraps `manage.py djust_check --json` (which itself always
  # exits 0) and sets a real exit code. It fails ONLY on error-severity
  # checks and the deprecated-attribute classes T001/T014/T015 (the exact
  # #1683 bug class) — NOT on the demo's intentional warnings (public-view
  # auth notices, partial-fragment templates).
  demo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Cache Python dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/uv
            .venv
          key: ${{ runner.os }}-python-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-python-

      - name: Install Python dependencies
        run: uv sync --extra dev

      - name: Run Django migrations (demo)
        run: |
          cd examples/demo_project
          uv run python manage.py migrate --noinput
          cd ../..

      - name: Dogfood djust_check against the demo (BLOCKING)
        run: |
          cd examples/demo_project
          PYTHONPATH=../.. uv run python ../../scripts/ci_djust_check_demo.py
          cd ../..
        env:
          PYTHONPATH: .

  # The benchmark-gated job tests/benchmarks/conftest.py has claimed exists
  # since it was written (#2156). It did not: a grep for `--benchmark-only`
  # across all twelve workflows returned nothing.
  #
  # That matters because `_assert_benchmark_under` skips its threshold whenever
  # `benchmark.stats` is unavailable, which is what pytest-benchmark does under
  # xdist — and every other job here runs `-n auto`. So the thresholds were
  # enforced only by the serial pre-push hook, i.e. in a process that had just
  # executed 10,000 tests, where a warm and fragmented heap makes the median
  # systematically slower. `test_vdom_diff_list_reorder` measures 3.78ms on a
  # quiet machine against its 5ms target and 7.57ms there — so it blocked every
  # push on main while measuring the environment rather than the code.
  #
  # Serial and alone, which is the whole point: this is the only context in
  # which a latency number means anything.
  #
  benchmarks:
    name: benchmarks (serial, thresholds enforced)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      # setup-uv + rust-cache, matching the six other uv jobs and every
      # Rust-building job in this file. The first version hand-rolled
      # `pip install uv` from main-health.yml — a second install path for one
      # project is the parallel-path drift class (#1646), which #2155's own
      # entry names. The cache also removes most of a ~2m30s build.
      - uses: astral-sh/setup-uv@v7
      - uses: Swatinem/rust-cache@v2

      - name: Install
        run: |
          uv sync --extra dev
          uv run maturin develop --release

      - name: Run benchmarks serially with thresholds enforced
        run: |
          # No -n auto: xdist disables stats collection, which is exactly how
          # these thresholds came to be unenforced everywhere.
          uv run python -m pytest tests/benchmarks/ --benchmark-only -q

  # Django's own template_tests against DjustTemplateBackend — the v1.2.0
  # conformance scoreboard (#2517). Clones django/django at the installed
  # tag, routes every Engine the suite builds through djust's Rust engine,
  # isolates segfaults per test, and prints the pass percentage.
  #
  # continue-on-error until it has been green on the runner once (#1534);
  # the `compare` step (the ratchet against scripts/django-template-suite-
  # baseline.json) is informational (`|| true`) for the same reason.
  # Promotion — drop continue-on-error, make compare blocking, add the job to
  # test-summary `needs` AND its &&-chain (#1713) — is a follow-up.
  # NOT wired into the test-summary aggregate gate.
  django-template-suite:
    name: django template_tests scoreboard (non-gating)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      # Nothing in this job pushes, and the child process executes the
      # cloned upstream test tree — do not leave the token on disk for it.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: astral-sh/setup-uv@v7
      - uses: Swatinem/rust-cache@v2

      - name: Install
        run: |
          uv sync --extra dev
          uv run maturin develop --release

      - name: Run Django's template_tests through djust
        run: |
          uv run python scripts/run-django-template-suite.py \
            --parsed-output .django-src/last-run.txt \
            --json .django-src/last-run.json
          {
            echo '## Django template_tests scoreboard'
            echo '```'
            tail -n 5 .django-src/last-run.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compare against the stored baseline (informational until promoted)
        run: |
          uv run python scripts/run-django-template-suite.py compare \
            --json .django-src/last-run.json || true

      - name: Runner self-tests against the real checkout
        run: |
          uv run python -m pytest python/tests/test_django_template_suite_2517.py -q

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: django-template-suite
          path: |
            .django-src/last-run.txt
            .django-src/last-run.json
          if-no-files-found: warn

  # Summary job - waits for all test jobs
  test-summary:
    runs-on: ubuntu-latest
    needs: [benchmarks, rust-tests, python-tests, javascript-tests, playwright-tests, browser-smoke, nav-hooks-guard, security-scan, security-tests, demo-checks]
    if: always()
    steps:
      # `needs.python-tests.result` is the MATRIX-WIDE result: GitHub reports
      # `success` only when every cell (3 interpreters on push x 4 shards)
      # succeeded, and `failure` if any cell failed — `fail-fast: false` lets
      # the other cells finish but does not soften the aggregate. The gate
      # therefore does not need to enumerate shards: one `needs` entry + one
      # `== "success"` clause covers all of them, exactly as it already
      # covered the 3.12/3.13/3.14 dimension before sharding.
      - name: Check test results
        run: |
          echo "Test Results Summary:"
          echo "  Rust tests: ${{ needs.rust-tests.result }}"
          echo "  Python tests: ${{ needs.python-tests.result }}"
          echo "  JavaScript tests: ${{ needs.javascript-tests.result }}"
          echo "  Playwright tests: ${{ needs.playwright-tests.result }} (optional)"
          echo "  Browser-smoke: ${{ needs.browser-smoke.result }}"
          echo "  Nav/hooks guard: ${{ needs.nav-hooks-guard.result }}"
          echo "  Security scan: ${{ needs.security-scan.result }}"
          echo "  Security tests: ${{ needs.security-tests.result }}"
          echo "  Demo checks: ${{ needs.demo-checks.result }}"
          echo "  Benchmarks: ${{ needs.benchmarks.result }}"

          # Core tests must pass (Rust, Python, JavaScript, Browser-smoke,
          # Nav/hooks guard, Security tests, Demo checks). The full
          # playwright-tests leg and security scan are informational (not
          # blocking) — only the stable browser-smoke canary gates from the
          # playwright family (#1869 / Action Tracker #314).
          if [ "${{ needs.rust-tests.result }}" == "success" ] && \
             [ "${{ needs.python-tests.result }}" == "success" ] && \
             [ "${{ needs.javascript-tests.result }}" == "success" ] && \
             [ "${{ needs.browser-smoke.result }}" == "success" ] && \
             [ "${{ needs.nav-hooks-guard.result }}" == "success" ] && \
             [ "${{ needs.security-tests.result }}" == "success" ] && \
             [ "${{ needs.demo-checks.result }}" == "success" ] && \
             [ "${{ needs.benchmarks.result }}" == "success" ]; then
            echo "All core tests passed!"
            if [ "${{ needs.playwright-tests.result }}" != "success" ]; then
              echo "WARNING: Playwright tests failed (optional, not blocking)"
            fi
            # ``skipped`` is the expected result on PR runs (security-scan
            # is push/schedule/dispatch only) — only warn on a true failure.
            if [ "${{ needs.security-scan.result }}" != "success" ] && \
               [ "${{ needs.security-scan.result }}" != "skipped" ]; then
              echo "WARNING: Security scan had warnings (review recommended)"
            fi
            exit 0
          else
            echo "FAILURE: Some core tests failed"
            exit 1
          fi
